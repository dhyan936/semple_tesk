<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cadence — a fast, focused task manager. Capture, organize, prioritize and complete your work." />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cadence — Tasks</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('cadence:theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
